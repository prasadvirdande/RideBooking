# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=Notification-Service
server.port=9091


# ==========================================
# GMAIL SMTP CONFIGURATION
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=prasadvirdande@gmail.com
spring.mail.password=ztuv vhdn vopn math

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true  
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update


# ==========================================
# EUREKA CONFIGURATION
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ==========================================
# KAFKA CONFIGURATION
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092


# ==========================================
# KAFKA CONSUMER CONFIGURATION
# ==========================================

spring.kafka.consumer.group-id=notification-service

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# ==========================================
# KAFKA JSON DESERIALIZATION
# ==========================================

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Use Notification Service's local DTO
spring.kafka.consumer.properties.spring.json.value.default.type=com.ridebooking.Notification_Service.DTO.Event.PaymentReceiptEvent

# Ignore producer's Java class information
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Trusted DTO package
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ridebooking.Notification_Service.DTO.Event
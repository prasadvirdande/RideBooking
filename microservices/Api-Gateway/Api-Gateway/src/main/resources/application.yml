server:
  port: 1000

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
        routes:

          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/auth/**

          - id: user-service
            uri: lb://USER-SERVICE
            predicates:
              - Path=/api/users/**

          - id: driver-service
            uri: lb://DRIVER-SERVICE
            predicates:
              - Path=/api/driver/**

          - id: ride-service
            uri: lb://RIDE-SERVICE
            predicates:
              - Path=/api/ride/**

          - id: payment-service
            uri: lb://PAYMENT-SERVICE
            predicates:
              - Path=/api/payment/**

          - id: notification-service
            uri: lb://NOTIFICATION-SERVICE
            predicates:
              - Path=/api/notification/**

jwt:
  secret: TXlTdXBlclNlY3JldEtleUZvckp3dFRva2VuR2VuZXJhdGlvbjEyMzQ1Njc4OTA=
  expiration: 86400000
  refresh-expiration: 604800000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
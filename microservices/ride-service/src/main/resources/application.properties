spring.application.name=ride-service

jwt.secret=TXlTdXBlclNlY3JldEtleUZvckp3dFRva2VuR2VuZXJhdGlvbjEyMzQ1Njc4OTA=

jwt.expiration=86400000

jwt.refresh-expiration=604800000

server.port=8080


# DATABASE CONFIGURATION

spring.datasource.url=jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


# REDIS CONFIGURATION

spring.data.redis.host=localhost
spring.data.redis.port=6379


# DEVTOOLS CONFIGURATION

spring.devtools.restart.enabled=true


# KAFKA CONFIGURATION

spring.kafka.bootstrap-servers=localhost:9092


# KAFKA PRODUCER CONFIGURATION

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.compression.type=snappy
# KAFKA CONSUMER CONFIGURATION

spring.kafka.consumer.group-id=ride-service

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.ridebooking.ride_service.DTO.Event.PaymentCompletedEvent

spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ridebooking.ride_service.DTO.Event
# EUREKA CONFIGURATION

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true